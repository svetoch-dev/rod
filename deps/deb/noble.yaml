#  Anytime this file is changed, the lockfile needs to be regenerated.
#
#  To generate the noble.lock.json run the following command
#
#     bazel run @noble//:lock
version: 1

sources:
  - channel: noble main
    url: https://snapshot.ubuntu.com/ubuntu/20240917T000000Z
  - channel: noble-security main
    url: https://snapshot.ubuntu.com/ubuntu/20240917T000000Z
  - channel: noble-updates main
    url: https://snapshot.ubuntu.com/ubuntu/20240917T000000Z

archs:
  - "amd64"

packages:
  # base image
  - "ncurses-base"
  - "libncurses6"
  - "tzdata"
  - "bash"
  - "coreutils" # for commands like `ls`
  - "grep"
  ## for apt list --installed
  - "dpkg"
  - "apt"
  - "perl"
  - "sed" #needed by py_binary rules
  - "mawk" #needed by py_binary rules +  mtree_mutate + rules_distroless.flatten
  # bazelisk deps
  - "git" #used in scripts/ci/ci.sh
  - "curl" #used in scripts/ci/ci.sh
  - "gzip" #used in scripts/ci/ci.sh
  - "libc-bin" #contains getent cli that is needed by tf to lookup HOME dir if its not set
  - "gcc" #needed by bazel
  - "findutils" #needed for requirements.txt.lock tests
  - "python3" #needed for requirements.txt.lock tests
