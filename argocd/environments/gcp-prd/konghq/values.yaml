kong-plugins:
  enabled: true
  plugins:
    - name: prometheus
      plugin_name: prometheus
      global: True
      annotations:
        kubernetes.io/ingress.class: konghq
      config:
        status_code_metrics: true
        latency_metrics: true
        bandwidth_metrics: true
        upstream_health_metrics: true

kong:
  ingressController:
    admissionWebhook:
      enabled: true
    ingressClass: konghq
    resources:
      limits:
        cpu: 500m
        memory: 500Mi
      requests:
        cpu: 20m
        memory: 90Mi
  resources:
    limits:
      cpu: 500m
      memory: 600Mi
    requests:
      cpu: 20m
      memory: 235Mi
  nodeSelector:
    apps-spot: "true"
  tolerations:
    - key: "apps-spot"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    ## targetCPUUtilizationPercentage only used if the cluster doesn't support autoscaling/v2beta
    targetCPUUtilizationPercentage:
    ## Otherwise for clusters that do support autoscaling/v2beta, use metrics
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 2000 # 0.4 cores
