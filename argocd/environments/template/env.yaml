repository:
  revision: '{{ .Values.global.repo.revision }}'

chart_apps:
  pomerium:
    enabled: true
    namespace: pomerium
  redis:
    enabled: true
    namespace: redis
  thanos:
    enabled: true
    namespace: prometheus
  prometheus:
    enabled: true
    namespace: prometheus
  rabbitmq:
    enabled: true
    namespace: rabbitmq
  cert-manager:
    enabled: true
    namespace: cert-manager
  konghq:
    enabled: true
    namespace: konghq
  external-dns:
    enabled: true
    namespace: external-dns
  postgres:
    enabled: true
    namespace: postgres
  fluent:
    enabled: true
    namespace: fluent
  loki:
    enabled: true
    namespace: loki

crds:
  enabled: true
  operators:
    pomerium:
      enabled: true
    prometheus-operator:
      enabled: true
    cert-manager:
      enabled: true
    external-dns:
      enabled: true
    konghq:
      enabled: true
    postgres-operator:
      enabled: true
    redis-operator:
      enabled: true
    rabbitmq-cluster:
      enabled: true
    rabbitmq-messaging-topology:
      enabled: true
    fluent-operator:
      enabled: true
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
global:
  alerts:
    receivers:
    - name: default
      telegramConfigs:
      - useDefaults: true
