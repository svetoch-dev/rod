certificates:
  enabled: true
  issuers:
    selfsigned:
      enabled: true
  certs:
    authn:
      enabled: true
      issuerRef:
        kind: ClusterIssuer
        name: '{{ printf "letsencrypt-%s" .Values.global.ingress.class }}'
  cluster_issuers:
    letsencrypt:
      enabled: true

gen-secrets:
  enabled: true

controller:
  enabled: true
