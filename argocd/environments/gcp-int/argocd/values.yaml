ingresses:
  server:
    enabled: true

argocd:
  enabled: true

  controller:
    resources:
      limits:
        cpu: 3000m
        memory: 2Gi
      requests:
        cpu: 350m
        memory: 1Gi

  server:
    resources:
      limits:
        cpu: 500m
        memory: 250Mi
      requests:
        cpu: 50m
        memory: 70Mi

  repoServer:
    resources:
      limits:
        cpu: 2000m
        memory: 600Mi
      requests:
        cpu: 150m
        memory: 150Mi

  applicationSet:
    resources:
      limits:
        cpu: 150m
        memory: 150Mi
      requests:
        cpu: 10m
        memory: 30Mi

redis:
  enabled: true
  sentinelServiceMonitor:
    enabled: true
  redisServiceMonitor:
    enabled: true
  sentinel:
    resources:
      requests:
        cpu: 10m
        memory: 10Mi
      limits:
        memory: 200Mi
        cpu: 1000m
    exporter:
      resources:
        requests:
          cpu: 10m
          memory: 10Mi
        limits:
          cpu: 100m
          memory: 50Mi
  redis:
    resources:
      requests:
        cpu: 50m
        memory: 10Mi
      limits:
        cpu: 1100m
        memory: 250Mi
    exporter:
      resources:
        requests:
          cpu: 10m
          memory: 15Mi
        limits:
          cpu: 100m
          memory: 50Mi

probes:
  enabled: true
  probes:
    argocd:
      enabled: true
