operator:
  prometheusOperator:
    enabled: true
    resources:
      limits:
        cpu: 150m
        memory: 200Mi
      requests:
        cpu: 10m
        memory: 30Mi
    prometheusConfigReloader:
      resources:
        limits:
          cpu: 200m
          memory: 100Mi
        requests:
          cpu: 10m
          memory: 20Mi


alertmanager-configs:
  enabled: true
  configs:
    main:
      enabled: true
      receivers:
        - name: sre
          slackConfigs:
            - channel: "#alerts-{{ .Values.global.company.name }}"
              useTpl: true
              apiURL:
                name: alertmanager
                key: SLACK_WEBHOOK
      route:
        continue: false
        receiver: sre
        matchers:
          - name: env
            value: "{{ .Values.global.env.short_name }}"
          - name: team
            value: "sre"
          - name: severity
            value: "(low|medium|high|critical)"
            regex: true

prometheus-node-exporter:
  enabled: true
  resources:
    limits:
      cpu: 250m
      memory: 50Mi
    requests:
      cpu: 10m
      memory: 20Mi

kube-state-metrics:
  enabled: true
  resources:
    limits:
      cpu: 100m
      memory: 100Mi
    requests:
      cpu: 10m
      memory: 20Mi

alertmanager-main:
  enabled: true

  alertmanager:
    spec:
      resources:
        limits:
          cpu: 100m
          memory: 100Mi
        requests:
          cpu: 10m
          memory: 25Mi

prometheus-main:
  enabled: true

  prometheus:
    spec:
      thanos:
        resources:
          limits:
            cpu: 350m
            memory: 150Mi
          requests:
            cpu: 10m
            memory: 35Mi

      resources:
        limits:
          cpu: 500m
          memory: 1Gi
        requests:
          cpu: 50m
          memory: 300Mi

      externalLabels:
        env: "{{ .Values.global.env.name }}"

      storage:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: "2Gi"

prometheus-blackbox-exporter:
  enabled: true
  resources:
    limits:
      cpu: 100m
      memory: 100Mi
    requests:
      cpu: 10m
      memory: 15Mi

prometheus-rules:
  enabled: true
  PrometheusAlerts:
    prometheus-main:
      env: "{{ .Values.global.env.short_name }}"
      AbsentMetricCritical:
        enabled: true
        rules:
          probe_success:
            enabled: true
      CriticalMetric:
        enabled: true
        rules:
          #Kong (nginx)
          ErrorRateIncreasedFor_5XX:
            enabled: true
          # Blackbox
          api:
            enabled: true
          # Resources
          OOM_killed_pods:
            enabled: true
          PVC_low_capacity:
            enabled: true
          # k8s
          Pods_waiting_state:
            enabled: true
          Pods_waiting_state_kube-system:
            enabled: true
          Pod_replicas_not_ready:
            enabled: true
          Daemonset_not_ready:
            enabled: true
          Statefulset_not_ready:
            enabled: true
          # redis
          Redis_missing_master:
            enabled: true
          Redis_too_many_masters:
            enabled: true
      WarningMetric:
        enabled: true
        rules:
          # redis
          Redis_disconnected_slaves:
            enabled: true
          # Resources
          PVC_low_capacity:
            enabled: true
          High_cpu_throttling:
            enabled: true
          High_memory_usage:
            enabled: true
          OOM_killed_pods_(on_node):
            enabled: true
          # Deployment
          Container_too_many_restarts:
            enabled: true
