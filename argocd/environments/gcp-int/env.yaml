repository:
  revision: master

chart_apps:
  grafana:
    enabled: true
    namespace: grafana
  thanos:
    enabled: true
    namespace: prometheus
    values: |
      global:
        company: {{ .Values.company | toYaml | nindent 6 }}
        registry: {{ .Values.registry | toYaml | nindent 6 }}
        bucket: {{ .Values.bucket | toYaml | nindent 6 }}
        network: {{ .Values.network | toYaml | nindent 6 }}
        env: {{ .Values.env | toYaml | nindent 6 }}
      thanos:
        query:
          stores:
            - {{ printf "thanos-%s-storegateway:10901" .Values.env.name }}
            - {{ printf "prometheus-%s-prometheus-main-thanos:8080" .Values.env.name }}
            - {{ printf "thanos-external-%s-query-grpc:10901" .Values.env.name }}
  thanos-external:
    enabled: true
    namespace: prometheus
    chart: argocd/charts/infra/charts/thanos
    values: |
      global:
        company: {{ .Values.company | toYaml | nindent 6 }}
        registry: {{ .Values.registry | toYaml | nindent 6 }}
        bucket: {{ .Values.bucket | toYaml | nindent 6 }}
        network: {{ .Values.network | toYaml | nindent 6 }}
        env: {{ .Values.env | toYaml | nindent 6 }}
      thanos:
        query:
          stores:
            {{- range $env_domain := .Values.externalEnvDomains }}
            - {{ printf "thanos.%s:443" $env_domain }}
            - {{ printf "thanos-store.%s:443" $env_domain }}
            {{- end }}
  prometheus:
    enabled: true
    namespace: prometheus
  pomerium:
    enabled: true
    namespace: pomerium
  cert-manager:
    enabled: true
    namespace: cert-manager
  argocd:
    enabled: true
    namespace: argocd
  external-dns:
    enabled: true
    namespace: external-dns
  redis:
    enabled: true

crds:
  enabled: true
  operators:
    pomerium:
      enabled: true
    argocd:
      enabled: true
    grafana-operator:
      enabled: true
    prometheus-operator:
      enabled: true
    cert-manager:
      enabled: true
    external-dns:
      enabled: true
    konghq:
      enabled: true
    redis-operator:
      enabled: true
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
