repository:
  revision: '{{ .Values.global.repo.revision }}'

chart_apps:
  grafana:
    enabled: true
    namespace: grafana
  thanos:
    enabled: true
    namespace: prometheus
  thanos-external:
    enabled: true
    namespace: prometheus
  prometheus:
    enabled: true
    namespace: prometheus
  pomerium:
    enabled: true
    namespace: pomerium
  cert-manager:
    enabled: true
    namespace: cert-manager
  argocd:
    enabled: true
    namespace: argocd
  external-dns:
    enabled: true
    namespace: external-dns
  redis:
    enabled: true
    namespace: redis
  fluent:
    enabled: true
    namespace: fluent
  loki:
    enabled: true
    namespace: loki

crds:
  enabled: true
  operators:
    pomerium:
      enabled: true
    argocd:
      enabled: true
    grafana-operator:
      enabled: true
    prometheus-operator:
      enabled: true
    cert-manager:
      enabled: true
    external-dns:
      enabled: true
    konghq:
      enabled: true
    redis-operator:
      enabled: true
    fluent-operator:
      enabled: true
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
global:
  alerts:
    receivers:
    - name: default
      telegramConfigs:
      - useDefaults: true
