repository:
  revision: master

chart_apps:
  grafana:
    enabled: true
    namespace: grafana
  thanos:
    enabled: true
    namespace: prometheus
    values: |
      thanos:
        query:
          stores:
            - {{ printf "thanos-%s-storegateway:10901" .Values.env.name }}
            - {{ printf "prometheus-%s-prometheus-main-thanos:8080" .Values.env.name }}
            - {{ printf "thanos-external-%s-query-grpc:10901" .Values.env.name }}
  thanos-external:
    enabled: true
    namespace: prometheus
    chart: argocd/charts/infra/charts/thanos
    values: |
      thanos:
        query:
          stores:
            {{- range $env_domain := .Values.externalEnvDomains }}
            - {{ printf "thanos.%s:443" $env_domain }}
            - {{ printf "thanos-store.%s:443" $env_domain }}
            {{- end }}
  prometheus:
    enabled: true
    namespace: prometheus
  cert-manager:
    enabled: true
    namespace: cert-manager
  argocd:
    enabled: true
    namespace: argocd
  external-dns:
    enabled: true
    namespace: external-dns
  konghq:
    enabled: true
    namespace: konghq
  redis:
    enabled: true

crds:
  enabled: true
  operators:
    argocd:
      enabled: true
    grafana-operator:
      enabled: true
    prometheus-operator:
      enabled: true
    cert-manager:
      enabled: true
    external-dns:
      enabled: true
    konghq:
      enabled: true
    redis-operator:
      enabled: true
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
