repository:
  revision: master

chart_apps:
  grafana:
    enabled: true
    namespace: grafana
  thanos:
    enabled: true
    namespace: prometheus
    values: |
      global: {{ .Values.global | toYaml | nindent 4 }}
      thanos:
        query:
          stores:
            - {{ printf "thanos-%s-storegateway:10901" .Values.global.env.name }}
            - {{ printf "prometheus-%s-prometheus-main-thanos:8080" .Values.global.env.name }}
            - {{ printf "thanos-external-%s-query-grpc:10901" .Values.global.env.name }}
  thanos-external:
    enabled: true
    namespace: prometheus
    chart: argocd/charts/infra/charts/thanos
    values: |
      global: {{ .Values.global | toYaml | nindent 4 }}
      thanos:
        query:
          stores:
            {{- range $env_name, $env_obj := .Values.externalEnvs }}
            - {{ printf "thanos.%s:443" $env_obj.domain }}
            - {{ printf "thanos-store.%s:443" $env_obj.domain }}
            {{- end }}
  prometheus:
    enabled: true
    namespace: prometheus
  pomerium:
    enabled: true
    namespace: pomerium
  cert-manager:
    enabled: true
    namespace: cert-manager
  argocd:
    enabled: true
    namespace: argocd
  external-dns:
    enabled: true
    namespace: external-dns
  redis:
    enabled: true
    namespace: redis
  fluent:
    enabled: true
    namespace: fluent
  loki:
    enabled: true
    namespace: loki

crds:
  enabled: true
  operators:
    pomerium:
      enabled: true
    argocd:
      enabled: true
    grafana-operator:
      enabled: true
    prometheus-operator:
      enabled: true
    cert-manager:
      enabled: true
    external-dns:
      enabled: true
    konghq:
      enabled: true
    redis-operator:
      enabled: true
    fluent-operator:
      enabled: true
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
