repository:
  revision: master

chart_apps:
  redis:
    enabled: true
    namespace: redis
  thanos:
    enabled: true
    namespace: prometheus
  prometheus:
    enabled: true
    namespace: prometheus
  rabbitmq:
    enabled: true
    namespace: rabbitmq
  cert-manager:
    enabled: true
    namespace: cert-manager
  konghq:
    enabled: true
    namespace: konghq
  external-dns:
    enabled: true
    namespace: external-dns
  postgres:
    enabled: true
    namespace: postgres

crds:
  enabled: true
  operators:
    prometheus-operator:
      enabled: true
    cert-manager:
      enabled: true
    external-dns:
      enabled: true
    konghq:
      enabled: true
    postgres-operator:
      enabled: true
    redis-operator:
      enabled: true
    rabbitmq-cluster:
      enabled: true
    rabbitmq-messaging-topology:
      enabled: true
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
