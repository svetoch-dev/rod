redis-operator:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 20Mi
    limits:
      cpu: 300m
      memory: 100Mi

redis-main:
  enabled: true
  auth:
    secretPath: redis-main
  sentinel:
    replicas: 3
    resources:
      requests:
        cpu: 10m
        memory: 10Mi
      limits:
        memory: 200Mi
        cpu: 1000m
    exporter:
      enabled: true
      image: leominov/redis_sentinel_exporter:1.7.1
      resources:
        requests:
          cpu: 10m
          memory: 10Mi
        limits:
          cpu: 100m
          memory: 50Mi
  sentinelServiceMonitor:
    enabled: true
  redis:
    replicas: 3
    resources:
      requests:
        cpu: 50m
        memory: 10Mi
      limits:
        cpu: 1100m
        memory: 250Mi
    exporter:
      enabled: true
      image: oliver006/redis_exporter:v1.62.0
      resources:
        requests:
          cpu: 10m
          memory: 15Mi
        limits:
          cpu: 100m
          memory: 50Mi
      env:
      - name: REDIS_USER
        value: default
      - name: REDIS_PASSWORD
        valueFrom:
          secretKeyRef:
            key: password
            name: redis-main
  redisServiceMonitor:
    enabled: true
