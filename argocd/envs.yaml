global:
  envs:
    production:
      cloud:
        network:
          int_nat_gw: "{INT_NAT_GW}"
      kubernetes:
        server: "https://{PRD_K8S_IP}"
    internal:
      enabled: true
      cloud:
        network:
          int_nat_gw: "{INT_NAT_GW}"
      kubernetes:
        server: https://kubernetes.default.svc
