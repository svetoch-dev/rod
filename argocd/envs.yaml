global:
  company:
    domain: rod.svetoch.dev
    name: rod

  repo:
    type: github
    provider: github.com
    name: infrastructure
    group: svetoch-dev
    revision: master

  envs:
    production:
      enabled: true
      name: production
      short_name: prd
      type: product
      users: {}
      registry:
        url: "{PRD_CONTAINER_REGISTRY}"
      dns:
        root: rod.svetoch.dev
        domain: "{{ .Values.global.env.short_name }}.{{ .Values.global.env.dns.root }}"
      cloud:
        name: "{CLOUD_TYPE}"
        buckets:
          type: "{BUCKET_TYPE}"
        network:
          int_nat_gw: "{INT_NAT_GW}"
      kubernetes:
        server: "https://{PRD_K8S_IP}"
    development:
      enabled: true
      name: development
      short_name: dev
      type: product
      users: {}
      registry:
        url: "{DEV_CONTAINER_REGISTRY}"
      dns:
        root: rod.svetoch.dev
        domain: "{{ .Values.global.env.short_name }}.{{ .Values.global.env.dns.root }}"
      cloud:
        name: "{CLOUD_TYPE}"
        buckets:
          type: "{BUCKET_TYPE}"
        network:
          int_nat_gw: "{INT_NAT_GW}"
      kubernetes:
        server: "https://{DEV_K8S_IP}"
    internal:
      enabled: true
      name: internal
      short_name: int
      type: internal
      users: {}
      registry:
        url: "{INT_CONTAINER_REGISTRY}"
      dns:
        root: rod.svetoch.dev
        domain: "{{ .Values.global.env.short_name }}.{{ .Values.global.env.dns.root }}"
      cloud:
        name: "{CLOUD_TYPE}"
        buckets:
          type: "{BUCKET_TYPE}"
        network:
          int_nat_gw: "{INT_NAT_GW}"
      kubernetes:
        server: https://kubernetes.default.svc
#Be carefull check the syncPolicy
#when setting enabled: false for envs
#or deleting this file. It may cause
#deletion of all your resources in all envs
