company:
  name: infrared
  domain:
    root: infrared.by
  admins:
    domain: ""
    emails: []

network:
  int_nat_gw: {INT_NAT_GW}

#Be carefull check the syncPolicy
#when setting enabled: false for envs
#or deleting this file. It may cause
#deletion of all your resources in all envs
repository:
  url: "git@github.com:ggramal/infrastructure.git"
  revision: master

root:
  enabled: true
  syncPolicy:
    automated:
      selfHeal: true

envs:
  gcp-prd:
    enabled: true
    values: |
      {{- /* Changing env name
             will probably recreate all
             k8s objects in this env
      */ -}}
      {{- $env := dict "name" "gcp-prd" }}
      {{- $env := set $env "short_name" "prd" }}
      {{- $env := set $env "long_name" "production" }}
      {{- $env := set $env "registry" "{PRD_CONTAINER_REGISTRY}}" }}
      {{- $env := set $env "server" "https://{PRD_K8S_IP}" }}
      {{- $context := mustDeepCopy . }}

      {{- tpl .Values.defaultValuesTpl (merge $context (dict "env" $env)) | nindent 2 }}
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    syncPolicy:
      automated:
        selfHeal: true
  gcp-dev:
    enabled: true
    values: |
      {{- /* Changing env name
             will probably recreate all
             k8s objects in this env
      */ -}}
      {{- $env := dict "name" "gcp-dev" }}
      {{- $env := set $env "short_name" "dev" }}
      {{- $env := set $env "long_name" "development" }}
      {{- $env := set $env "registry" "{DEV_CONTAINER_REGISTRY}}" }}
      {{- $env := set $env "server" "https://{DEV_K8S_IP}" }}
      {{- $context := mustDeepCopy . }}

      {{- tpl .Values.defaultValuesTpl (merge $context (dict "env" $env)) | nindent 2 }}
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    syncPolicy:
      automated:
        selfHeal: true
  gcp-int:
    enabled: true
    values: |
      {{- /* Changing env name
             will probably recreate all
             k8s objects in this env
      */ -}}
      {{- $env := dict "name" "gcp-int" }}
      {{- $env := set $env "short_name" "int" }}
      {{- $env := set $env "long_name" "internal" }}
      {{- $env := set $env "registry" "{INT_CONTAINER_REGISTRY}}" }}
      {{- $env := set $env "server"  "https://kubernetes.default.svc" }}
      {{- $context := mustDeepCopy . }}

      externalEnvDomains:
      {{- range $env_name, $env_obj := .Values.envs }}
      {{- $env_short_name := regexSplit "-" $env_name -1 | last }}
      {{- if and (ne $env_short_name "int") $env_obj.enabled }}
      - {{ printf "%s.%s" $env_short_name $.Values.company.domain.root }}
      {{- end }}
      {{- end }}

      {{- tpl .Values.defaultValuesTpl (merge $context (dict "env" $env)) | nindent 2 }}
    finalizers:
      - resources-finalizer.argocd.argoproj.io
    syncPolicy:
      automated:
        selfHeal: true
